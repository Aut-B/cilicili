name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select Xcode
        run: |
          set -euo pipefail
          # 先完整捕获输出再解析：xcodebuild -version 直接接 awk 时，awk 命中即退出会
          # 提前关闭管道，导致 xcodebuild 写失败并 abort（Broken pipe / exit 134）。
          xcode_version_output="$(xcodebuild -version)"
          current_major="$(printf '%s\n' "$xcode_version_output" | awk '$1 == "Xcode" { split($2, version, "."); print version[1]; exit }')"
          if [ "$current_major" != "26" ]; then
            for developer_dir in \
              "/Applications/Xcode_26.4.1.app/Contents/Developer" \
              "/Applications/Xcode_26.4.app/Contents/Developer" \
              "/Applications/Xcode_26.3.app/Contents/Developer" \
              "/Applications/Xcode_26.2.app/Contents/Developer" \
              "/Applications/Xcode_26.1.1.app/Contents/Developer" \
              "/Applications/Xcode_26.0.1.app/Contents/Developer"; do
              if [ -d "$developer_dir" ]; then
                sudo xcode-select --switch "$developer_dir"
                break
              fi
            done
          fi

          selected_version="$(printf '%s\n' "$xcode_version_output" | awk '$1 == "Xcode" { print $2; exit }')"
          selected_major="${selected_version%%.*}"
          if [ "$selected_major" != "26" ]; then
            echo "Xcode 26 is required; selected $selected_version" >&2
            exit 1
          fi
          echo "XCODE_VERSION_MAJOR=$selected_major" >> "$GITHUB_ENV"
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build Release app without signing
        run: zsh Scripts/build-release-unsigned-ipa.sh

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cilicili-release-unsigned-ipa
          path: build/release-unsigned-ipa/bili-release-unsigned.ipa
          if-no-files-found: error
